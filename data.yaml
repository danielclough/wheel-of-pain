  title: The Dendera Light
  claim: Ancient Egyptian relief depicts electric light bulbs proving ancient advanced technology
  description: Relief at Temple of Hathor shows lotus flower with snake inside, claimed by pseudoarchaeologists to be a light bulb and filament. Actually depicts Egyptian mythological symbolism. Egyptologist Wolfgang Waitkus confirmed hieroglyphs describe mythological content, not technology.
  category: ["technology"]
  episode: 5
  url: https://www.youtube.com/watch?v=2OOrlhtdONE&list=PLXtMIzD-Y-bM_5Bw-AYVh_0DZKhMuk87d&index=5
  drink:
  sponsor:

-
  title: Baghdad Battery
  claim: Ancient Parthian artifacts were primitive electrical batteries proving advanced ancient technology
  description: Clay jars with iron rods and copper cylinders from Mesopotamia claimed to be 2000-year-old batteries, likely storage vessels for scrolls
  category: ["technology"]
  episode: [6, 6.5]
  url: [https://www.youtube.com/watch?v=cRZR_TeVi5Y&list=PLXtMIzD-Y-bM_5Bw-AYVh_0DZKhMuk87d&index=6, https://www.youtube.com/watch?v=19mhccQ3nVA&list=PLXtMIzD-Y-bM_5Bw-AYVh_0DZKhMuk87d&index=7]
  drink:
  sponsor:

-  
  title: The Gosford Glyphs
  claim: Ancient Egyptian hieroglyphs in Australia prove Egyptians sailed there 5000 years ago
  description: Carvings in Brisbane Water National Park claimed to tell story of two Egyptian princes shipwrecked in Australia. Egyptologists unanimously agree they are modern forgeries with numerous errors no ancient Egyptian scribe would make.
  category: ["artifact"]
  episode: 7
  url: https://www.youtube.com/watch?v=30jMvj4L_jo&list=PLXtMIzD-Y-bM_5Bw-AYVh_0DZKhMuk87d&index=8
  drink:
  sponsor:

