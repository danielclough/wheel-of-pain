  title: The Orontius Finaeus Map
  claim: 1531 map supposedly shows ice-free Antarctica, proving ancient advanced civilizations mapped the continent
  description: Map created by French cartographer Oronce Finé actually shows a massive inference connecting Australia to South America, not Antarctica. Conspiracy theorists like Charles Hapgood and Graham Hancock manipulated the map by rotating, scaling, and editing it to fit their claims.
  category: ["map"]
  episode: 2
  url: https://www.youtube.com/watch?v=dBRMy-6YXcs&list=PLXtMIzD-Y-bM_5Bw-AYVh_0DZKhMuk87d&index=2
  drink:
  sponsor:

-  
  title: The Grave Creek Stone
  claim: Mysterious artifact with unknown language found in West Virginia burial mound in 1838
  description: Small sandstone disk allegedly found clutched in skeletal hands bearing mysterious characters. Various researchers claimed it was Iberian, Punic, or other Mediterranean scripts. Used to support white supremacist theories about European contact with Americas. Most interpretations were inconsistent and likely a hoax.
  category: ["artifact"]
  episode: 3
  url: https://www.youtube.com/watch?v=-6JeTtPJMGo&list=PLXtMIzD-Y-bM_5Bw-AYVh_0DZKhMuk87d&index=3
  drink:
  sponsor:

