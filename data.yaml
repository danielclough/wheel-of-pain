  title: The Oldoway Man
  claim: A skeletally modern homo sapien skeleton found in Middle Pleistocene deposits in Olduvai Gorge dating to ~700,000 years old
  description: Skeleton found in 1913 by Hans Reck in Tanzania appeared to be nearly a million years old based on depositional layer. Louis Leakey later proved it was an intrusive burial from ~20,000 years ago. Most records and the skeleton itself were lost in WWI and WWII.
  category: ["skeleton"]
  episode: 1
  url: https://www.youtube.com/watch?v=USHWhxlJLj8&list=PLXtMIzD-Y-bM_5Bw-AYVh_0DZKhMuk87d&index=1
  drink:
  sponsor:

