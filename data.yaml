  title: Nebraska Man
  claim: Tooth found in Nebraska in 1917 belonged to extinct North American great ape or human ancestor
  description: Harold Cook found tooth identified by Henry Fairfield Osborn as Hesperopithecus haroldcookii. Later expeditions found more remains proving it was actually from an extinct peccary (pig-like mammal). Used by creationists to discredit evolution despite being example of science self-correcting.
  category: ["skeleton", "creationism"]
  episode: 8
  url: https://www.youtube.com/watch?v=lfhE266Nfbk&list=PLXtMIzD-Y-bM_5Bw-AYVh_0DZKhMuk87d&index=9
  drink:
