[package]
name = "wheel-of-pain"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "MouseEvent",
    "SvgElement",
    "TouchEvent",
    "Touch",
    "TouchList",
    "Window",
] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
