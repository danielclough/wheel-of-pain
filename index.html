<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Awful Archaeology - Wheel of Pain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
        }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            margin: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal h2 { margin-bottom: 1rem; color: #ff6b35; }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }
        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 1rem 0;
        }
        .word-cloud-item {
            cursor: pointer;
            padding: 0.5rem 1rem;
            background: #3a3a3a;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .word-cloud-item:hover { background: #ff6b35; transform: scale(1.05); }
        .word-cloud-item.selected { background: #ff6b35; }
        .controls {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 100;
            max-width: 200px;
        }

        @media (max-width: 768px) {
            .controls {
                top: 0.5rem;
                right: 0.5rem;
                gap: 0.5rem;
                max-width: 150px;
            }
        }
        @keyframes button-spin {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        button {
            padding: 0.75rem 1.5rem;
            background: #ff6b35;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
            width: 100%;
            text-align: center;
        }

        select {
            width: 100%;
        }

        @media (max-width: 768px) {
            button {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            select {
                padding: 0.6rem !important;
                font-size: 0.9rem !important;
            }
        }
        button:hover {
            background: #ff5520;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.5);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
            animation: button-spin 1s ease-in-out infinite;
        }
        @keyframes subtle-bg-glow {
            0%, 100% {
                background: radial-gradient(circle at center, rgba(255, 107, 53, 0.03) 0%, transparent 70%);
            }
            50% {
                background: radial-gradient(circle at center, rgba(255, 107, 53, 0.06) 0%, transparent 70%);
            }
        }

        .wheel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            background: radial-gradient(circle at center, rgba(255, 107, 53, 0.03) 0%, transparent 70%);
            animation: subtle-bg-glow 3s ease-in-out infinite;
        }
        .wheel-svg {
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition: transform 0.08s cubic-bezier(0.4, 0.0, 0.2, 1),
                        filter 0.15s ease-out;
            will-change: transform, filter;
            transform-origin: center center;
            max-width: 100vmin;
            max-height: 100vmin;
            width: 100%;
            height: auto;
        }
        .wheel-svg:active {
            cursor: grabbing;
        }
        .wheel-svg.spinning {
            cursor: default;
            animation: subtle-pulse 0.8s ease-in-out infinite;
        }

        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.98; }
        }

        @keyframes pulse-glow {
            0%, 100% {
                opacity: 0.9;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.15);
            }
        }

        @keyframes arrow-shake {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-3deg); }
            75% { transform: translateX(-50%) rotate(3deg); }
        }

        .arrow {
            position: absolute;
            top: 1%;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-top: 70px solid #ff6b35;
            z-index: 10;
            filter: drop-shadow(0 6px 12px rgba(255, 107, 53, 0.5));
            transition: filter 0.3s ease, transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-origin: center bottom;
        }

        @media (max-width: 768px) {
            .arrow {
                border-left: 25px solid transparent;
                border-right: 25px solid transparent;
                border-top: 50px solid #ff6b35;
            }
        }
        .arrow.spinning {
            animation: pulse-glow 0.4s ease-in-out infinite,
                       arrow-shake 0.15s ease-in-out infinite;
            filter: drop-shadow(0 8px 16px rgba(255, 107, 53, 0.9))
                    drop-shadow(0 0 20px rgba(255, 107, 53, 0.6));
        }
        .detail-content { line-height: 1.6; }
        .detail-content p { margin: 1rem 0; }
        .detail-content a {
            color: #ff6b35;
            text-decoration: none;
            word-break: break-all;
        }
        .detail-content a:hover { text-decoration: underline; }
        .episode-badge {
            display: inline-block;
            background: #4a4a4a;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
