<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Awful Archaeology - Wheel of Pain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
        }
        @keyframes modal-fade-in {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fade-in 0.2s ease-out;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: linear-gradient(145deg, #2a2a2a 0%, #252525 100%);
            border-radius: 16px;
            padding: 0;
            max-width: 700px;
            max-height: 85vh;
            overflow: hidden;
            margin: 1rem;
            box-shadow: 0 25px 80px rgba(0,0,0,0.7),
                        0 0 1px rgba(255, 107, 53, 0.3);
            border: 1px solid rgba(255, 107, 53, 0.2);
            animation: modal-fade-in 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .modal-thumbnail {
            width: 100%;
            height: auto;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
            border-bottom: 2px solid rgba(255, 107, 53, 0.3);
        }

        .modal-thumbnail img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .modal-thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 0;
            background: #1a1a1a;
            border-bottom: 2px solid rgba(255, 107, 53, 0.3);
        }

        .thumbnail-link {
            text-decoration: none;
            display: block;
        }

        .modal-thumbnail-item {
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
        }

        .modal-thumbnail-item img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .thumbnail-link:hover .modal-thumbnail-item img,
        .thumbnail-link:hover .modal-thumbnail img {
            transform: scale(1.05);
        }

        .thumbnail-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding: 1.5rem 1rem 0.75rem 1rem;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
        }

        .modal-thumbnail-item:not(:last-child) {
            border-right: 1px solid rgba(255, 107, 53, 0.2);
        }

        @media (max-width: 768px) {
            .modal-thumbnails-grid {
                grid-template-columns: 1fr;
            }
            .modal-thumbnail-item:not(:last-child) {
                border-right: none;
                border-bottom: 1px solid rgba(255, 107, 53, 0.2);
            }
        }

        .modal h2 {
            margin: 0;
            padding: 1.5rem 2rem 1rem 2rem;
            color: #ff6b35;
            font-size: 1.75rem;
            line-height: 1.3;
        }

        .category-modal {
            padding: 0;
        }

        .category-modal .word-cloud {
            padding: 1.5rem 2rem;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.75rem;
            cursor: pointer;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            z-index: 10;
            transition: all 0.2s ease;
            line-height: 1;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 107, 53, 0.9);
            border-color: rgba(255, 107, 53, 1);
            transform: rotate(90deg);
        }
        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 2rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        .word-cloud::-webkit-scrollbar {
            width: 8px;
        }

        .word-cloud::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 4px;
        }

        .word-cloud::-webkit-scrollbar-thumb {
            background: #ff6b35;
            border-radius: 4px;
        }

        .word-cloud-item {
            cursor: pointer;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, #3a3a3a 0%, #333 100%);
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
            border: 1px solid transparent;
            font-weight: 500;
        }

        .word-cloud-item:hover {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
            border-color: rgba(255, 107, 53, 0.5);
        }

        .word-cloud-item.selected {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.4);
            border-color: rgba(255, 107, 53, 0.5);
        }
        .controls {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 100;
            max-width: 200px;
        }

        @media (max-width: 768px) {
            .controls {
                top: 0.5rem;
                right: 0.5rem;
                gap: 0.5rem;
                max-width: 150px;
            }
        }
        @keyframes button-spin {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        button {
            padding: 0.75rem 1.5rem;
            background: #ff6b35;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
            width: 100%;
            text-align: center;
        }

        select {
            width: 100%;
        }

        @media (max-width: 768px) {
            button {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            select {
                padding: 0.6rem !important;
                font-size: 0.9rem !important;
            }
        }
        button:hover {
            background: #ff5520;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.5);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
            animation: button-spin 1s ease-in-out infinite;
        }
        @keyframes subtle-bg-glow {
            0%, 100% {
                background: radial-gradient(circle at center, rgba(255, 107, 53, 0.03) 0%, transparent 70%);
            }
            50% {
                background: radial-gradient(circle at center, rgba(255, 107, 53, 0.06) 0%, transparent 70%);
            }
        }

        .wheel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            background: radial-gradient(circle at center, rgba(255, 107, 53, 0.03) 0%, transparent 70%);
            animation: subtle-bg-glow 3s ease-in-out infinite;
        }
        .wheel-svg {
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition: transform 0.08s cubic-bezier(0.4, 0.0, 0.2, 1),
                        filter 0.15s ease-out;
            will-change: transform, filter;
            transform-origin: center center;
            max-width: 100vmin;
            max-height: 100vmin;
            width: 100%;
            height: auto;
        }
        .wheel-svg:active {
            cursor: grabbing;
        }
        .wheel-svg.spinning {
            cursor: default;
            animation: subtle-pulse 0.8s ease-in-out infinite;
        }

        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.98; }
        }

        @keyframes pulse-glow {
            0%, 100% {
                opacity: 0.9;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.15);
            }
        }

        @keyframes arrow-shake {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-3deg); }
            75% { transform: translateX(-50%) rotate(3deg); }
        }

        .arrow {
            position: absolute;
            top: 1%;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-top: 70px solid #ff6b35;
            z-index: 10;
            filter: drop-shadow(0 6px 12px rgba(255, 107, 53, 0.5));
            transition: filter 0.3s ease, transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-origin: center bottom;
        }

        @media (max-width: 768px) {
            .arrow {
                border-left: 25px solid transparent;
                border-right: 25px solid transparent;
                border-top: 50px solid #ff6b35;
            }
        }
        .arrow.spinning {
            animation: pulse-glow 0.4s ease-in-out infinite,
                       arrow-shake 0.15s ease-in-out infinite;
            filter: drop-shadow(0 8px 16px rgba(255, 107, 53, 0.9))
                    drop-shadow(0 0 20px rgba(255, 107, 53, 0.6));
        }
        .detail-content {
            line-height: 1.6;
            padding: 0 2rem 2rem 2rem;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .detail-content::-webkit-scrollbar {
            width: 8px;
        }

        .detail-content::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 4px;
        }

        .detail-content::-webkit-scrollbar-thumb {
            background: #ff6b35;
            border-radius: 4px;
        }

        .detail-content::-webkit-scrollbar-thumb:hover {
            background: #ff5520;
        }

        .detail-content p {
            margin: 1rem 0;
            color: #e0e0e0;
        }

        .detail-content strong {
            color: #fff;
        }
        .detail-content a {
            color: #ff6b35;
            text-decoration: none;
            word-break: break-all;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .detail-content a:hover {
            color: #ff5520;
            text-decoration: none;
            transform: translateX(4px);
        }

        .episode-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin: 0 0 1rem 0;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
        }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
