<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Awful Archaeology - Wheel of Pain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
        }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            margin: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal h2 { margin-bottom: 1rem; color: #ff6b35; }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }
        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 1rem 0;
        }
        .word-cloud-item {
            cursor: pointer;
            padding: 0.5rem 1rem;
            background: #3a3a3a;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .word-cloud-item:hover { background: #ff6b35; transform: scale(1.05); }
        .word-cloud-item.selected { background: #ff6b35; }
        .controls {
            display: flex;
            gap: 1rem;
            padding: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 0.75rem 1.5rem;
            background: #ff6b35;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #ff5520; }
        button:disabled { background: #555; cursor: not-allowed; }
        .wheel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 600px;
            position: relative;
        }
        .wheel-svg {
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .wheel-svg.spinning { cursor: default; }
        .arrow {
            position: absolute;
            top: 10%;
            right: 50%;
            transform: translateX(50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff6b35;
            z-index: 10;
        }
        .detail-content { line-height: 1.6; }
        .detail-content p { margin: 1rem 0; }
        .detail-content a {
            color: #ff6b35;
            text-decoration: none;
            word-break: break-all;
        }
        .detail-content a:hover { text-decoration: underline; }
        .episode-badge {
            display: inline-block;
            background: #4a4a4a;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import init from './pkg/wheel_of_pain.js';
        init();
    </script>
</body>
</html>
